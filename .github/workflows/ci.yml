name: CI Build & Test

on:
  push:
    branches: [ main, master, "dev/*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Run jako Build & Tests
        shell: bash
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew check --stacktrace 2>&1 | tee build-check.log || {
            grep -rn -C 5 "<failure" */build/test-results/ 2>/dev/null | head -n 60 | tr '\r' ' ' | awk '{printf "%s%%0A", $0} END {print ""}' | sed 's/^/::error title=Failed Test XML::/' || true
            tail -n 60 build-check.log | tr '\r' ' ' | awk '{printf "%s%%0A", $0} END {print ""}' | sed 's/^/::error title=Gradle check log tail::/'
            exit 1
          }

      - name: Run sample Build & Tests
        shell: bash
        working-directory: sample
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew check --stacktrace 2>&1 | tee sample-check.log || {
            grep -rn -C 5 "<failure" build/test-results/ 2>/dev/null | head -n 60 | tr '\r' ' ' | awk '{printf "%s%%0A", $0} END {print ""}' | sed 's/^/::error title=Failed Sample Test XML::/' || true
            tail -n 60 sample-check.log | tr '\r' ' ' | awk '{printf "%s%%0A", $0} END {print ""}' | sed 's/^/::error title=Sample check log tail::/'
            exit 1
          }
