---
name: "Tagged Release"

on:
  push:
    tags:
      - "v*"
      - "!v*-dev-*"

jobs:
  tagged-release:
    name: "Tagged Release"
    if: ${{ !contains(github.ref_name, '-dev-') }}
    runs-on: "ubuntu-latest"

    steps:
      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: ${{ contains(github.ref_name, '-rc-') }}
